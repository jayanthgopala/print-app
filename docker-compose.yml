version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: print-platform-postgres
    environment:
      POSTGRES_DB: printplatform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d printplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: print-platform-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      WS_PORT: 3001
      JWT_SECRET: dev-secret-key-change-in-production-min-32-characters
      DATABASE_URL: postgresql://admin:password123@postgres:5432/printplatform
      SQLITE_PATH: /app/data/shops.db
      CORS_ORIGIN: http://localhost:5173
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: print-files
      STORAGE_PUBLIC_URL: http://localhost:9000/print-files
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: npm run dev

  # Frontend
  frontend:
    build: ./frontend
    container_name: print-platform-frontend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3001
      VITE_STORAGE_UPLOAD_URL: http://localhost:9000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # MinIO (S3-compatible object storage for development)
  minio:
    image: minio/minio:latest
    container_name: print-platform-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  backend_data:
  minio_data:
