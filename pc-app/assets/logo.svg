<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1e2e"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="160" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="paper" x1="200" y1="160" x2="320" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0ecff"/>
    </linearGradient>
    <filter id="glow-f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.08"/>

  <!-- Printer body -->
  <rect x="120" y="210" width="272" height="120" rx="24" fill="#262b38" stroke="#3a4158" stroke-width="3"/>

  <!-- Printer top slot -->
  <rect x="160" y="200" width="192" height="16" rx="8" fill="#1c2030"/>

  <!-- Paper coming out top (input) -->
  <g filter="glow-f">
    <rect x="188" y="120" width="136" height="96" rx="8" fill="url(#paper)"/>
  </g>
  <!-- Paper text lines -->
  <rect x="208" y="144" width="72" height="6" rx="3" fill="#4f8ff7" opacity="0.7"/>
  <rect x="208" y="158" width="96" height="5" rx="2.5" fill="#94a3b8" opacity="0.4"/>
  <rect x="208" y="170" width="56" height="5" rx="2.5" fill="#94a3b8" opacity="0.4"/>
  <rect x="208" y="182" width="80" height="5" rx="2.5" fill="#94a3b8" opacity="0.4"/>

  <!-- Paper output tray -->
  <rect x="148" y="330" width="216" height="16" rx="8" fill="#2a3044" stroke="#3a4158" stroke-width="2"/>

  <!-- Printed paper coming out bottom -->
  <rect x="188" y="318" width="136" height="72" rx="6" fill="#f0f4ff" opacity="0.9"/>
  <rect x="206" y="336" width="60" height="5" rx="2.5" fill="#34d399" opacity="0.7"/>
  <rect x="206" y="348" width="84" height="4" rx="2" fill="#94a3b8" opacity="0.35"/>
  <rect x="206" y="358" width="48" height="4" rx="2" fill="#94a3b8" opacity="0.35"/>
  <rect x="206" y="368" width="70" height="4" rx="2" fill="#94a3b8" opacity="0.35"/>

  <!-- Status LED -->
  <circle cx="158" cy="260" r="8" fill="#34d399"/>
  <circle cx="158" cy="260" r="8" fill="#34d399" opacity="0.4">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Control panel dots -->
  <circle cx="340" cy="250" r="6" fill="#3a4158"/>
  <circle cx="340" cy="270" r="6" fill="#3a4158"/>
  <circle cx="360" cy="250" r="6" fill="#4f8ff7" opacity="0.6"/>
  <circle cx="360" cy="270" r="6" fill="#3a4158"/>

  <!-- Brand accent line -->
  <rect x="172" y="298" width="168" height="4" rx="2" fill="url(#glow)" opacity="0.6"/>
</svg>
