name = "print-app-backend"
main = "server.js"
compatibility_date = "2026-03-11"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_URL = "https://buildergrids.tech"
ADMIN_FRONTEND_URL = "https://admindeveloper.buildergrids.tech"
ALLOWED_ORIGINS = "https://buildergrids.tech,https://admindeveloper.buildergrids.tech"

[observability]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true

[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "printapp"

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fbfb543083a34a2dae3fc9d9f569fc8f"
