name = "print-shop-backend"
main = "worker.js"
compatibility_date = "2024-12-19"

# Durable Objects binding
[durable_objects]
bindings = [
  { name = "WEBSOCKET_RELAY", class_name = "WebSocketRelay" }
]

# Environment variables (set these in Cloudflare dashboard or use wrangler secret)
# [vars]
# SUPABASE_URL = "https://your-project.supabase.co"
# FRONTEND_URL = "https://your-frontend.pages.dev"
# ADMIN_FRONTEND_URL = "https://your-admin.pages.dev"

# Secrets (use: wrangler secret put <name>)
# - JWT_SECRET
# - SUPABASE_SERVICE_ROLE_KEY
# - ADMIN_SETUP_KEY (optional)

# Migration for Durable Objects
[[migrations]]
tag = "v1"
new_classes = ["WebSocketRelay"]
